<!DOCTYPE html><html><head><title>Rental Application</title><style>body{font-family:Arial;background:#f4f6fb;padding:30px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:white;padding:20px;border-radius:15px}.icon{font-size:60px}button{background:#6c3cff;color:white;border:0;padding:10px;border-radius:7px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><h1>💻 Electronics Rental</h1><div class="grid" id="grid"></div><br><a href="index.html">← Home</a><script>let p=[['💻','Laptop','₹499/day'],['📷','Camera','₹799/day'],['📽️','Projector','₹599/day'],['🎮','Gaming Console','₹699/day'],['🔊','Speaker','₹299/day'],['📱','Tablet','₹399/day']];document.getElementById('grid').innerHTML=p.map(x=>`<div class="card"><div class="icon">${x[0]}</div><h2>${x[1]}</h2><b>${x[2]}</b><p><button onclick="rent('${x[1]}')">Rent Now</button></p></div>`).join('');function rent(x){localStorage.setItem('selectedProduct',x);location.href='booking.html'}</script></body></html>
