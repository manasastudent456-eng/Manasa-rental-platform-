<!DOCTYPE html><html><head><title>Admin Application</title><style>body{font-family:Arial;background:#f4f6fb;padding:30px}.stats{display:flex;gap:15px;flex-wrap:wrap}.stat{background:white;padding:25px;border-radius:15px;min-width:150px}.stat b{font-size:28px;color:#6c3cff}table{width:100%;background:white;border-collapse:collapse;margin-top:25px}td,th{padding:12px;border-bottom:1px solid #ddd;text-align:left}</style></head><body><h1>⚙️ Admin Application</h1><div class="stats"><div class="stat">Users<br><b id="u">0</b></div><div class="stat">Products<br><b id="p">0</b></div><div class="stat">Bookings<br><b id="b">0</b></div><div class="stat">Revenue<br><b id="r">₹0</b></div></div><h2>Bookings</h2><div id="data"></div><a href="index.html">← Home</a><script>let bookings=JSON.parse(localStorage.getItem('bookings')||'[]'),products=JSON.parse(localStorage.getItem('products')||'[]');u.textContent=localStorage.getItem('user')?1:0;p.textContent=5+products.length;b.textContent=bookings.length;r.textContent='₹'+bookings.reduce((s,x)=>s+Number(x.total),0);data.innerHTML=bookings.length?'<table><tr><th>Product</th><th>Start</th><th>End</th><th>Amount</th><th>Status</th></tr>'+bookings.map(x=>`<tr><td>${x.product}</td><td>${x.start}</td><td>${x.end}</td><td>₹${x.total}</td><td>${x.status}</td></tr>`).join('')+'</table>':'<p>No bookings yet.</p>'</script></body></html>
