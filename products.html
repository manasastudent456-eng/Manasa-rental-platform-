<!DOCTYPE html><html><head><title>Product Management</title><style>body{font-family:Arial;background:#f4f6fb;padding:30px}.box{background:white;padding:25px;max-width:700px;margin:auto;border-radius:15px}input,select,button{padding:11px;margin:5px}button{background:#6c3cff;color:white;border:0;border-radius:7px}.item{padding:12px;border-bottom:1px solid #ddd}</style></head><body><div class="box"><h1>📦 Product Management</h1><input id="name" placeholder="Product name"><select id="cat"><option>Laptops</option><option>Cameras</option><option>Projectors</option><option>Gaming</option><option>Audio</option></select><input id="price" placeholder="Price/day" type="number"><button onclick="add()">Add Product</button><div id="list"></div><br><a href="index.html">← Home</a></div><script>let a=JSON.parse(localStorage.getItem('products')||'[]');function show(){list.innerHTML=a.map((x,i)=>`<div class="item">${x.name} — ${x.cat} — ₹${x.price}/day <button onclick="del(${i})">Delete</button></div>`).join('')}function add(){if(!name.value||!price.value)return alert('Fill details');a.push({name:name.value,cat:cat.value,price:price.value});localStorage.setItem('products',JSON.stringify(a));show();name.value='';price.value=''}function del(i){a.splice(i,1);localStorage.setItem('products',JSON.stringify(a));show()}show()</script></body></html>
