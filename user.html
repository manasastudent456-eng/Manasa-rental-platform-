<!DOCTYPE html><html><head><title>User Application</title><style>body{font-family:Arial;padding:30px;background:#f4f6fb}.box{background:white;padding:25px;max-width:500px;margin:auto;border-radius:15px}input,button{width:100%;padding:12px;margin:8px 0}button{background:#6c3cff;color:white;border:0;border-radius:8px}</style></head><body><div class="box"><h1>👤 User Application</h1><p>Register / Login</p><input id="name" placeholder="Name"><input id="email" placeholder="Email"><input type="password" placeholder="Password"><button onclick="login()">Register / Login</button><p id="msg"></p><a href="index.html">← Home</a></div><script>function login(){let n=document.getElementById('name').value;if(!n){alert('Enter your name');return}localStorage.setItem('user',n);document.getElementById('msg').textContent='Welcome, '+n+'! Login successful.'}</script></body></html>
